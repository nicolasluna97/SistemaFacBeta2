<div class="navbar-container">
  <div class="nav-left">
    <!-- (vacío por ahora) -->
  </div>

  <div class="nav-right">

    <!-- Toggle tema (NUEVO) -->
    <button
      class="theme-toggle"
      type="button"
      (click)="toggleTheme()"
      [attr.aria-pressed]="isDark"
      title="Cambiar tema"
    >
      <span class="theme-label">Tema</span>

      <span class="theme-switch" [class.on]="isDark">
        <span class="theme-knob"></span>
      </span>

      <span class="theme-ico" aria-hidden="true">{{ isDark ? '🌙' : '☀️' }}</span>
    </button>

    <!-- Botón Ingresar -->
    <button
      *ngIf="!isAuthenticated"
      class="login-btn"
      type="button"
      (click)="gotoLogin()"
    >
      Ingresar
    </button>

    <!-- Botón avatar -->
    <button
      *ngIf="isAuthenticated"
      class="icon-btn"
      type="button"
      (click)="toggleMenu()"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuOpen"
      title="Cuenta"
    >
      <img class="nav-ico" src="assets/icons/account.svg" alt="Cuenta" />
    </button>

    <!-- Menú desplegable -->
    <div *ngIf="menuOpen" class="menu" role="menu">
      <button
        class="menu-item"
        type="button"
        (click)="gotoAccount(); menuOpen=false"
      >
        <img class="nav-ico" src="assets/icons/account.svg" alt="" />
        Cuenta
      </button>

      <button
        class="menu-item"
        type="button"
        (click)="gotoHelp(); menuOpen=false"
      >
        <img class="nav-ico" src="assets/icons/badge-question-mark.svg" alt="" />
        Ayuda
      </button>

      <hr />

      <button class="menu-item danger" type="button" (click)="logout()">
        <img class="nav-ico" src="assets/icons/log-out.svg" alt="" />
        Salir
      </button>
    </div>
  </div>
</div>
